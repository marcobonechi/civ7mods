<!doctype html><html><head><meta charset="utf-8"><title>icon render</title></head>
<body style="background:#444;color:#eee;font-family:sans-serif">
<p>icon render page</p>
<script>
// Draw an SVG string onto a canvas of the given size and return a PNG data URL.
window.renderSvg = function (svgText, size) {
  return new Promise((resolve, reject) => {
    const blob = new Blob([svgText], { type: "image/svg+xml" });
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas");
      c.width = size; c.height = size;
      const ctx = c.getContext("2d");
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
      ctx.drawImage(img, 0, 0, size, size);
      document.body.appendChild(c);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/png"));
    };
    img.onerror = (e) => reject(new Error("svg failed to load"));
    img.src = url;
  });
};
</script></body></html>
