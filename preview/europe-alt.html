    // Natural wonders.
    // `wonders` are attempted at an exact hex first; the engine validates the whole footprint
    // (Thera needs four coastal tiles, Kilimanjaro three adjacent mountains) and a placement that
    // does not fit is skipped with a log line rather than forced.
    // `wonderSites` fix the place but not the wonder: the candidates are shuffled per game and the
    // first whose footprint fits the ground wins, so the site is a certainty and the wonder is not.
    // `requestedWonders` are handed to the base generator, which moves them to the front of its
    // shuffled list and forces their placement chance to 100%, so they are the ones that appear -
    // but it picks the hex uniformly from every valid one on the map, which is why the two lists
    // above exist at all.
    wonders: [
        { feature: "FEATURE_THERA", lon: 25.4, lat: 36.4 },
        { feature: "FEATURE_KILIMANJARO", lon: 17.11, lat: 7.89 },
        // Gullfoss is a real place inside this window and was already in the requested list below,
        // so pinning it costs no variety - it only stops the golden falls surfacing in the Atlas.
        // It also gives Iceland the wonder its civilization is built around, and tundra hills are
        // the only ground it accepts here anyway.
        //
        // Vihren was pinned to the Pirin too and had to come out: it wants three connected
        // mountains in a PLAINS biome, and the Pirin comes out grassland on the 128x112 and
        // 144x126 grids, so the pin failed there and fell back to the random pass. Widening the
        // search far enough to find plains mountains put it in Serbia or Anatolia, which is worse
        // than leaving it to chance. It stays in requestedWonders. tools/check-map-sizes.mjs
        // reports this, so it is worth retrying if the Balkan biomes ever change.
        // Gullfoss is not here, and cannot be. Asked directly, the engine accepts it on 0 hexes
        // of this map out of the 547 that match its own terrain and biome rows - and the same for
        // FEATURE_IGUAZU_FALLS, the only other feature tagged WATERFALL. The twice it has ever
        // appeared it stood on a FLAT hex, which Feature_ValidTerrains says is invalid for it. The
        // contradiction is inside the engine and nothing a map script sets - terrain, biome, river,
        // Direction, Elevation, all tried - changes the answer. It stays in requestedWonders so it
        // turns up on the rare map that suits it. Iceland gets a wonder it can actually keep below.
    ],

    // Natural wonder sites. Several civilizations are weak without a natural wonder they own, and
    // borders reach only three tiles from a city centre: Isabella scales her wonder tile yields by
    // the number of wonders in her empire, Iceland reads culture off every wonder and volcano tile
    // it holds, and Majapahit's Meru pays happiness per wonder tile in the city. Left to the
    // random pass the chance any one of them starts with a workable wonder is about one in twenty,
    // because the generator draws from every valid hex between Iceland and Iran. A site fixes that
    // for one region without fixing which wonder turns up there.
    //
    // Each site spends one of the map's wonder slots (NumNaturalWonders in data/maps.xml: 9 on the
    // compact grid, 16 on the largest), so there are only two.
    wonderSites: [
        // Iceland, measured rather than assumed: asked what it would accept within six hexes of
        // Reykjavik, the engine answered Bermuda Triangle 40, Barrier Reef 9, Torres del Paine 8,
        // Great Blue Hole 3 - and Gullfoss nothing. Torres del Paine leads because it is the only
        // land wonder among them and glacial peaks in tundra are what Iceland is; the marine three
        // follow so the site fills even where the mountains do not line up. This is what the civ
        // needs: a wonder inside its borders for the culture its ability reads off wonder tiles.
        { name: "Iceland", lon: -20.12, lat: 64.33, radius: 5,

// europe-raster.js
// Turns the lon/lat geography in europe-geo.js into a hex grid.
// Pure JavaScript: no engine calls, so the same code runs in the game and in a browser preview.

const T = { OCEAN: 0, COAST: 1, FLAT: 2, HILL: 3, MOUNTAIN: 4, RIVER: 5 };
const B = { MARINE: "M", GRASSLAND: "G", PLAINS: "P", DESERT: "D", TUNDRA: "T", TROPICAL: "R" };

const DEG = Math.PI / 180;
const ROW_SPACING = 0.866; // physical distance between hex rows, in column units

function makeProjection(GEO, W, H) {
    // Latitude mapping: optional piecewise-linear control points [lat, rowFraction] (ascending).
    const ctrl = GEO.latControl || [[GEO.latBottom, 0], [GEO.latTop, 1]];
    const fracToLat = (f) => {
        if (f <= ctrl[0][1]) return ctrl[0][0];
        for (let i = 1; i < ctrl.length; i++) {
            if (f <= ctrl[i][1]) {
                const t = (f - ctrl[i - 1][1]) / (ctrl[i][1] - ctrl[i - 1][1]);
                return ctrl[i - 1][0] + t * (ctrl[i][0] - ctrl[i - 1][0]);
            }
        }
        return ctrl[ctrl.length - 1][0];
    };
    const latToFrac = (lat) => {
        if (lat <= ctrl[0][0]) return ctrl[0][1] + (lat - ctrl[0][0]) * (ctrl[1][1] - ctrl[0][1]) / (ctrl[1][0] - ctrl[0][0]);
        for (let i = 1; i < ctrl.length; i++) {
            if (lat <= ctrl[i][0]) {
                const t = (lat - ctrl[i - 1][0]) / (ctrl[i][0] - ctrl[i - 1][0]);
                return ctrl[i - 1][1] + t * (ctrl[i][1] - ctrl[i - 1][1]);
            }
        }
        const n = ctrl.length - 1;
        return ctrl[n][1] + (lat - ctrl[n][0]) * (ctrl[n][1] - ctrl[n - 1][1]) / (ctrl[n][0] - ctrl[n - 1][0]);
    };
    const dLat = (GEO.latTop - GEO.latBottom) / (H - 1);   // average, kept for reference
    const cosRef = Math.cos(GEO.latRef * DEG);
    const latOf = (y) => fracToLat(y / (H - 1));
    const dLatAt = (y) => {
        const y0 = Math.max(0, y - 1), y1 = Math.min(H - 1, y + 1);
        return (latOf(y1) - latOf(y0)) / Math.max(1, y1 - y0);
    };
    const dLonAt = (lat) => (GEO.spanRef / W) * Math.pow(cosRef / Math.max(0.15, Math.cos(lat * DEG)), GEO.scaleExp);
    // Optional horizontal squeeze east of a longitude ("lonSqueeze"): each screen degree east of
    // `from` covers k geographic degrees, so the east takes fewer columns.
    const lq = GEO.lonSqueeze;
    // Western squeeze ("lonSqueezeWest"): west of `from`, each screen degree covers k geographic
    // degrees, but only south of latNone (full strength at latFull and below), so West Africa fits.
    // lonSqueezeWest.segments: [[fromLon, k], ...] westwards (first entry is the easternmost edge);
    // legacy form {from, k} is one segment. Strength blends from 1 at latNone to full at latFull.
    const lw = GEO.lonSqueezeWest;
    const lwSegs = !lw ? [] : (lw.segments || [[lw.from, lw.k]]);
    const lwFrom = lwSegs.length ? lwSegs[0][0] : -1e9;
    const wBlend = (tLat) => {
        if (!lw) return 0;
        if (tLat >= lw.latNone) return 0;
        if (tLat <= lw.latFull) return 1;
        return (lw.latNone - tLat) / (lw.latNone - lw.latFull);
    };
    const kSeg = (i, tLat) => 1 + (lwSegs[i][1] - 1) * wBlend(tLat);
    // screen -> geo: walk the segments westwards
    const geoFromScreenWest = (s, tLat) => {
        let sEdge = lwFrom, gEdge = lwFrom;
        for (let i = 0; i < lwSegs.length; i++) {
            const k = kSeg(i, tLat);
            const gNext = i + 1 < lwSegs.length ? lwSegs[i + 1][0] : -1e9;   // geo where the next segment starts
            const sNext = sEdge - (gEdge - gNext) / k;                         // its screen position
            if (s >= sNext) return gEdge - (sEdge - s) * k;
            sEdge = sNext; gEdge = gNext;
        }
        return gEdge - (sEdge - s);
    };
    const screenFromGeoWest = (g, tLat) => {
        let sEdge = lwFrom, gEdge = lwFrom;
        for (let i = 0; i < lwSegs.length; i++) {
            const k = kSeg(i, tLat);
            const gNext = i + 1 < lwSegs.length ? lwSegs[i + 1][0] : -1e9;
            if (g >= gNext) return sEdge - (gEdge - g) / k;
            sEdge = sEdge - (gEdge - gNext) / k; gEdge = gNext;
        }
        return sEdge - (gEdge - g);
    };
    const kWestAt = (g, tLat) => { for (let i = lwSegs.length - 1; i >= 0; i--) if (g < lwSegs[i][0]) return kSeg(i, tLat); return 1; };
    const geoFromScreen = (s, tLat) => {
        if (lq && s > lq.from) return lq.from + (s - lq.from) * lq.k;
        if (lwSegs.length && s < lwFrom) return geoFromScreenWest(s, tLat);
        return s;
    };
    const screenFromGeo = (g, tLat) => {
        if (lq && g > lq.from) return lq.from + (g - lq.from) / lq.k;
        if (lwSegs.length && g < lwFrom) return screenFromGeoWest(g, tLat);
        return g;
    };
    const lonScaleAt = (lon, tLat) => (lq && lon > lq.from) ? lq.k : kWestAt(lon, tLat);   // geographic degrees per screen degree
    const lonOf = (x, y) => geoFromScreen(GEO.lonCenter + (x + 0.5 * (y & 1) - (W - 1) / 2) * dLonAt(latOf(y)), latOf(y));

    // Optional longitude-dependent vertical remap south of a pivot latitude ("southWarp").
    // westMap is a list of [geoLat, tileLat] control points used in the west (lon <= lonWestEnd);
    // it blends to the identity mapping at lon >= lonEastStart. Must end at [latPivot, latPivot].
    const sw = GEO.southWarp;
    // zones: each has a longitude window (ramp in from lonStart to lonFullStart, full weight until
    // lonFullEnd, ramp out to lonEnd) and its own [geoLat, tileLat] map. Legacy form: westMap only.
    const zones = !sw ? [] : (sw.zones || [{ lonStart: -1000, lonFullStart: -999, lonFullEnd: sw.lonWestEnd, lonEnd: sw.lonEastStart, map: sw.westMap }]);
    const zoneWeight = (z, lon) => {
        if (lon <= z.lonStart || lon >= z.lonEnd) return 0;
        if (lon < z.lonFullStart) return (lon - z.lonStart) / (z.lonFullStart - z.lonStart);
        if (lon <= z.lonFullEnd) return 1;
        return 1 - (lon - z.lonFullEnd) / (z.lonEnd - z.lonFullEnd);
    };
    const kAt = (lon) => {            // total remap weight at this longitude (0 = plain projection)
        let s = 0;
        for (const z of zones) s += zoneWeight(z, lon);
        return Math.min(1, s);
    };
    const piecewise = (pts, v, i0, i1) => {   // interpolate column i1 from column i0
        if (v <= pts[0][i0]) return pts[0][i1] + (v - pts[0][i0]) * (pts[1][i1] - pts[0][i1]) / (pts[1][i0] - pts[0][i0]);
        for (let i = 1; i < pts.length; i++) {
            if (v <= pts[i][i0]) {
                const t = (v - pts[i - 1][i0]) / (pts[i][i0] - pts[i - 1][i0]);
                return pts[i - 1][i1] + t * (pts[i][i1] - pts[i - 1][i1]);
            }
        }
        return pts[pts.length - 1][i1];
    };
    // geographic latitude -> tile latitude at this longitude
    const geoToTileLat = (lon, geoLat) => {
        if (!sw || geoLat >= sw.latPivot) return geoLat;
        let acc = 0, wsum = 0;
        for (const z of zones) {
            const w = zoneWeight(z, lon);
            if (w > 0) { acc += w * piecewise(z.map, geoLat, 0, 1); wsum += w; }
        }
        if (wsum <= 0) return geoLat;
        if (wsum > 1) { acc /= wsum; wsum = 1; }
        return geoLat * (1 - wsum) + acc;
    };
    // tile latitude (row) -> geographic latitude at this longitude (numeric inverse, monotonic)
    const tileToGeoLat = (lon, tileLat) => {
        if (!sw || tileLat >= sw.latPivot) return tileLat;
        if (kAt(lon) <= 0) return tileLat;
        let lo = -40, hi = sw.latPivot;
        for (let i = 0; i < 40; i++) {
            const mid = (lo + hi) / 2;
            if (geoToTileLat(lon, mid) < tileLat) lo = mid; else hi = mid;
        }
        return (lo + hi) / 2;
    };
    const geoLatAt = (x, y) => tileToGeoLat(lonOf(x, y), latOf(y));

    // Continuous tile coordinates (xf includes the odd-row half shift). Input is geographic lon/lat.
    const toTile = (lon, lat) => {
        const tLat = geoToTileLat(lon, lat);
        const yf = latToFrac(tLat) * (H - 1);
        const xf = (screenFromGeo(lon, tLat) - GEO.lonCenter) / dLonAt(tLat) + (W - 1) / 2;
        return [xf, yf];
    };
    const nearestTile = (lon, lat) => {
        const [xf, yf] = toTile(lon, lat);
        const y = Math.round(yf);
        const x = Math.round(xf - 0.5 * (y & 1));
        return [x, y];
    };
    return { W, H, dLat, dLatAt, latOf, lonOf, dLonAt, toTile, nearestTile, kAt, geoLatAt, tileToGeoLat, lonScaleAt };
}

// ---- geometry helpers ------------------------------------------------------

function bbox(pts) {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const p of pts) {
        if (p[0] < minX) minX = p[0];
        if (p[0] > maxX) maxX = p[0];
        if (p[1] < minY) minY = p[1];
        if (p[1] > maxY) maxY = p[1];
    }
    return [minX, minY, maxX, maxY];
}

function pointInPolygon(lon, lat, poly) {
    const bb = poly.bb;
    if (lon < bb[0] || lon > bb[2] || lat < bb[1] || lat > bb[3]) return false;
    const pts = poly.pts;
    let inside = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
        const xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
        if ((yi > lat) !== (yj > lat)) {
            const xInt = xi + (lat - yi) * (xj - xi) / (yj - yi);
            if (lon < xInt) inside = !inside;
        }
    }
    return inside;
}

function prepPolys(list) {
    return (list || []).map((p) => ({ name: p.name, pts: p.pts, bb: bbox(p.pts), biome: p.biome, rain: p.rain, prob: p.prob, coastDist: p.coastDist }));
}

function inAny(lon, lat, polys) {
    for (const p of polys) if (pointInPolygon(lon, lat, p)) return true;
    return false;
}

// distance from point to segment, in tile units (rows scaled by ROW_SPACING)
function segDist(px, py, ax, ay, bx, by) {
    const sy = ROW_SPACING;
    const vx = bx - ax, vy = (by - ay) * sy;
    const wx = px - ax, wy = (py - ay) * sy;
    const len2 = vx * vx + vy * vy;
    let t = len2 > 0 ? (wx * vx + wy * vy) / len2 : 0;
    if (t < 0) t = 0; else if (t > 1) t = 1;
    const dx = wx - t * vx, dy = wy - t * vy;
    return Math.sqrt(dx * dx + dy * dy);
}

function hexNeighbors(x, y) {
    if (y & 1) {
        return [[x + 1, y], [x - 1, y], [x + 1, y + 1], [x, y + 1], [x + 1, y - 1], [x, y - 1]];
    }
    return [[x + 1, y], [x - 1, y], [x, y + 1], [x - 1, y + 1], [x, y - 1], [x - 1, y - 1]];
}

function hexDistance(x1, y1, x2, y2) {
    const q1 = x1 - (y1 - (y1 & 1)) / 2, r1 = y1;
    const q2 = x2 - (y2 - (y2 & 1)) / 2, r2 = y2;
    const dq = q1 - q2, dr = r1 - r2, ds = (-q1 - r1) - (-q2 - r2);
    return Math.max(Math.abs(dq), Math.abs(dr), Math.abs(ds));
}

// ---- main ------------------------------------------------------------------

// The One Landmass map is the Distant Lands geography with its separations taken out, derived
// here rather than kept as a second geo file so the two maps can never drift apart: every edit
// to europe-large-geo.js reaches both. It drops the Distant Lands anchors (one region for all
// land) and every waterLine marked separatesDistantLands - the channels that exist only to cut
// one landmass into two (the Karelian passage, the Palestine channel). The map scripts and the
// check tools all call this, so what the tools verify is what the game builds.
function oneLandmassGeo(GEO) {
    return {
        ...GEO,
        distantLandsAnchors: [],
        waterLines: (GEO.waterLines || []).filter((l) => !l.separatesDistantLands),
        mountainWalls: (GEO.mountainWalls || []).filter((l) => !l.separatesDistantLands),
    };
}

function buildEuropeGrid(W, H, GEO, rnd) {
    const P = makeProjection(GEO, W, H);
    const N = W * H;
    const rangeScale = GEO.rangeScale || 1;
    const blobScale = GEO.blobScale || 1;
    const idx = (x, y) => y * W + x;
    const inBounds = (x, y) => x >= 0 && x < W && y >= 0 && y < H;

    // Land polygons marked `late` are painted after the water polygons, so a landmass can sit
    // inside a sea drawn over what used to be land (Eurasia Compressed's East Asia).
    const landPolys = prepPolys((GEO.land || []).filter((p) => !p.late));
    const lateLandPolys = prepPolys((GEO.land || []).filter((p) => p.late));
    const waterPolys = prepPolys(GEO.water);
    const shallowPolys = prepPolys(GEO.shallow);
    const biomePolys = prepPolys(GEO.biomeAreas);
    const rainPolys = prepPolys(GEO.rainAreas);

    const isLand = new Uint8Array(N);
    const isLake = new Uint8Array(N);   // water painted as a lake: always shallow
    const terrain = new Uint8Array(N);
    const biome = new Array(N);
    const rain = new Uint16Array(N);
    const region = new Array(N);   // "W" or "E"
    const continent = new Int8Array(N).fill(-1);   // index into GEO.continents, -1 for water
    const lonC = new Float32Array(N);
    const latC = new Float32Array(N);

    // sample offsets around a hex center, in tile units
    const SAMPLE_R = 0.42;
    const samples = [];
    for (let k = 0; k < 6; k++) {
        const a = (k * 60 + 30) * DEG;
        samples.push([SAMPLE_R * Math.cos(a), SAMPLE_R * Math.sin(a) / ROW_SPACING]);
    }

    // 1. land vs water from polygons
    for (let y = 0; y < H; y++) {
        const tileLat = P.latOf(y);
        const dLonTile = P.dLonAt(tileLat);
        const dLatTile = P.dLatAt(y);
        for (let x = 0; x < W; x++) {
            const lon = P.lonOf(x, y);
            const i = idx(x, y);
            const lat = P.tileToGeoLat(lon, tileLat);       // geographic latitude of this hex
            // geographic degrees per row / per column at this hex (local slopes of the remaps)
            const dLatRow = P.tileToGeoLat(lon, tileLat + dLatTile * 0.5) - P.tileToGeoLat(lon, tileLat - dLatTile * 0.5);
            const dLon = dLonTile * P.lonScaleAt(lon, tileLat);
            lonC[i] = lon;
            latC[i] = lat;
            let land = inAny(lon, lat, landPolys);
            if (!land) {
                let count = 0;
                for (const s of samples) {
                    if (inAny(lon + s[0] * dLon, lat + s[1] * dLatRow, landPolys)) count++;
                }
                if (count >= 2) land = true;
            }
            if (land) {
                let water = inAny(lon, lat, waterPolys);
                if (!water) {
                    let count = 0;
                    for (const s of samples) {
                        if (inAny(lon + s[0] * dLon, lat + s[1] * dLatRow, waterPolys)) count++;
                    }
                    if (count >= 4) water = true;
                }
                if (water) land = false;
            }
            if (!land && lateLandPolys.length) {
                land = inAny(lon, lat, lateLandPolys);
                if (!land) {
                    let count = 0;
                    for (const s of samples) {
                        if (inAny(lon + s[0] * dLon, lat + s[1] * dLatRow, lateLandPolys)) count++;
                    }
                    if (count >= 2) land = true;
                }
            }
            isLand[i] = land ? 1 : 0;
        }
    }

    // 2. small islands
    const paintBlob = (lon, lat, r, value) => {
        const [xf, yf] = P.toTile(lon, lat);
        let painted = 0;
        const [nx, ny] = P.nearestTile(lon, lat);
        const R = Math.ceil(r) + 1;
        for (let y = ny - R; y <= ny + R; y++) {
            for (let x = nx - R; x <= nx + R; x++) {
                if (!inBounds(x, y)) continue;
                const dx = (x + 0.5 * (y & 1)) - xf;
                const dy = (y - yf) * ROW_SPACING;
                if (Math.sqrt(dx * dx + dy * dy) < r) {
                    isLand[idx(x, y)] = value;
                    if (value === 0) isLake[idx(x, y)] = 1;
                    painted++;
                }
            }
        }
        if (painted === 0 && inBounds(nx, ny)) {
            isLand[idx(nx, ny)] = value;
            if (value === 0) isLake[idx(nx, ny)] = 1;
        }
    };
    for (const b of GEO.landBlobs || []) paintBlob(b[0], b[1], b[2] * blobScale, 1);

    // 3. straits: one-tile-wide water lines, kept hex-connected
    const markWater = (x, y) => { if (inBounds(x, y)) isLand[idx(x, y)] = 0; };
    for (const line of GEO.waterLines || []) {
        let prev = null;
        for (let s = 0; s < line.pts.length - 1; s++) {
            const a = line.pts[s], b = line.pts[s + 1];
            const [ax, ay] = P.toTile(a[0], a[1]);
            const [bx, by] = P.toTile(b[0], b[1]);
            const steps = Math.max(1, Math.ceil(Math.sqrt((bx - ax) ** 2 + ((by - ay) * ROW_SPACING) ** 2) * 4));
            for (let k = 0; k <= steps; k++) {
                const t = k / steps;
                const lon = a[0] + (b[0] - a[0]) * t;
                const lat = a[1] + (b[1] - a[1]) * t;
                const [x, y] = P.nearestTile(lon, lat);
                if (prev && (prev[0] !== x || prev[1] !== y) && hexDistance(prev[0], prev[1], x, y) > 1) {
                    // bridge the gap with a shared neighbour
                    for (const n of hexNeighbors(prev[0], prev[1])) {
                        if (hexDistance(n[0], n[1], x, y) <= 1) { markWater(n[0], n[1]); break; }
                    }
                }
                markWater(x, y);
                prev = [x, y];
            }
        }
    }

    // 4. lakes
    for (const l of GEO.lakes || []) paintBlob(l[0], l[1], l[2] * blobScale, 0);

    // 4b. islands that sit between straits (painted after the lines)
    for (const b of GEO.landBlobsLate || []) paintBlob(b[0], b[1], b[2] * blobScale, 1);

    // 4c. narrow straits: reduce a channel to a single hex without ever sealing it.
    // Coordinate-pinned blobs cannot do this reliably, because the hex under a given lon/lat moves
    // with the grid size. This fills water along the line only while a route through still exists,
    // outermost hexes first, so whatever remains is the narrowest connected channel the geometry
    // allows - one hex wide at every grid size, and never a closed sea.
    for (const st of GEO.narrowStraits || []) {
        const r = st.radius || 2.0;
        const samples = [];
        for (let k = 0; k < st.pts.length - 1; k++) {
            const a = st.pts[k], b = st.pts[k + 1];
            const [ax, ay] = P.toTile(a[0], a[1]);
            const [bx, by] = P.toTile(b[0], b[1]);
            const steps = Math.max(1, Math.ceil(Math.sqrt((bx - ax) ** 2 + ((by - ay) * ROW_SPACING) ** 2) * 3));
            for (let j = 0; j <= steps; j++) {
                const t = j / steps;
                samples.push(P.toTile(a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t));
            }
        }
        const nearestWater = (xf, yf) => {
            const nx = Math.round(xf), ny = Math.round(yf);
            let best = -1, bd = Infinity;
            for (let y = ny - 4; y <= ny + 4; y++) for (let x = nx - 4; x <= nx + 4; x++) {
                if (!inBounds(x, y) || isLand[idx(x, y)]) continue;
                const dx = (x + 0.5 * (y & 1)) - xf, dy = (y - yf) * ROW_SPACING;
                const d = Math.sqrt(dx * dx + dy * dy);
                if (d < bd) { bd = d; best = idx(x, y); }
            }
            return best;
        };
        // Connectivity is judged between two points far out in the open seas, not at the ends of the
        // line: preserving a route between the line's own endpoints does not stop the fill severing
        // the strait from the sea beyond it.
        const openA = st.openA ? P.toTile(st.openA[0], st.openA[1]) : samples[0];
        const openB = st.openB ? P.toTile(st.openB[0], st.openB[1]) : samples[samples.length - 1];
        const from = nearestWater(openA[0], openA[1]);
        const to = nearestWater(openB[0], openB[1]);
        if (from < 0 || to < 0 || from === to) continue;
        const connected = () => {
            const seen = new Uint8Array(N); const q = [from]; seen[from] = 1;
            for (let h = 0; h < q.length; h++) {
                const cur = q[h]; if (cur === to) return true;
                const cx = cur % W, cy = (cur - cx) / W;
                for (const [nx2, ny2] of hexNeighbors(cx, cy)) {
                    if (!inBounds(nx2, ny2)) continue;
                    const ni = idx(nx2, ny2);
                    if (isLand[ni] || seen[ni]) continue;
                    seen[ni] = 1; q.push(ni);
                }
            }
            return false;
        };
        if (!connected()) continue;                 // already closed: leave it alone
        // candidates: water near the line, farthest from it first
        const cand = new Map();
        const skip = st.skipEnds === undefined ? 0.2 : st.skipEnds;
        const mid = samples.slice(Math.floor(samples.length * skip), Math.ceil(samples.length * (1 - skip)));
        for (const [xf, yf] of mid) {
            const nx = Math.round(xf), ny = Math.round(yf), R = Math.ceil(r) + 1;
            for (let y = ny - R; y <= ny + R; y++) for (let x = nx - R; x <= nx + R; x++) {
                if (!inBounds(x, y) || isLand[idx(x, y)]) continue;
                const dx = (x + 0.5 * (y & 1)) - xf, dy = (y - yf) * ROW_SPACING;
                const d = Math.sqrt(dx * dx + dy * dy);
                if (d >= r) continue;
                const i = idx(x, y);
                if (i === from || i === to) continue;
                if (!cand.has(i) || cand.get(i) > d) cand.set(i, d);
            }
        }
        const order = [...cand.entries()].sort((a, b) => b[1] - a[1]).map((e) => e[0]);
        for (const i of order) {
            isLand[i] = 1; isLake[i] = 0;
            if (!connected()) { isLand[i] = 0; }   // that hex was the channel: put it back
        }
    }

    // 4b2. per-hex patches, land/water half. Applied here, before the straits and
    // before the coast distances, mountains and landmass regions below, so a hex
    // turned to land or water is seen by every pass that depends on the shape.
    for (const h of GEO.hexPatches || []) {
        if (h.land === undefined) continue;
        const [x, y] = P.nearestTile(h.lon, h.lat);
        if (!inBounds(x, y)) continue;
        const i = idx(x, y);
        isLand[i] = h.land ? 1 : 0;
        if (h.land) isLake[i] = 0;
    }

    // 5. map edge: keep the left/right columns water
    for (let y = 0; y < H; y++) { isLand[idx(0, y)] = 0; isLand[idx(W - 1, y)] = 0; }

    // 5b. optional sea lane along the bottom edge (from the left border up to a longitude)
    if (GEO.bottomWater) {
        for (let y = 0; y < GEO.bottomWater.rows; y++) {
            for (let x = 0; x < W; x++) {
                if (P.lonOf(x, y) <= GEO.bottomWater.untilLon) { isLand[idx(x, y)] = 0; isLake[idx(x, y)] = 1; }
            }
        }
    }
    // 5b'. optional open sea along the top edge (GEO.topWater: { rows }), for a map whose far north
    // is squashed so hard that the Arctic coast would otherwise run off the top and close the ocean
    if (GEO.topWater) {
        for (let y = H - GEO.topWater.rows; y < H; y++) for (let x = 0; x < W; x++) isLand[idx(x, y)] = 0;
    }
    // 5c. optional sea lane along the left edge, for rows below a tile latitude
    if (GEO.leftWater) {
        for (let y = 0; y < H; y++) {
            if (P.latOf(y) >= GEO.leftWater.belowLat) continue;
            for (let x = 0; x < GEO.leftWater.cols; x++) { isLand[idx(x, y)] = 0; isLake[idx(x, y)] = 1; }
        }
    }

    // 6. distance to land (hex steps) for coast/ocean
    const distLand = new Int16Array(N).fill(-1);
    let frontier = [];
    for (let i = 0; i < N; i++) if (isLand[i]) { distLand[i] = 0; frontier.push(i); }
    let d = 0;
    while (frontier.length && d < 4) {
        d++;
        const next = [];
        for (const i of frontier) {
            const x = i % W, y = (i - x) / W;
            for (const n of hexNeighbors(x, y)) {
                if (!inBounds(n[0], n[1])) continue;
                const j = idx(n[0], n[1]);
                if (distLand[j] < 0) { distLand[j] = d; next.push(j); }
            }
        }
        frontier = next;
    }

    for (let i = 0; i < N; i++) {
        if (isLand[i]) { terrain[i] = T.FLAT; continue; }
        const x = i % W;
        // shallow polygons: all water is coast, unless the polygon sets coastDist (hexes from land)
        let coastDist = 1;
        if (isLake[i] === 1) coastDist = 999;
        else for (const p of shallowPolys) if (pointInPolygon(lonC[i], latC[i], p)) { coastDist = Math.max(coastDist, p.coastDist === undefined ? 999 : p.coastDist); }
        let isCoast;
        const d = distLand[i];
        if (coastDist >= 999) isCoast = true;
        else if (coastDist <= 1) isCoast = d > 0 && d <= 1;                 // open sea: coast hugs the land
        else if (d <= coastDist - 1) isCoast = true;                        // inland-ish seas: ragged edge
        else if (d === coastDist) isCoast = rnd() < 0.7;
        else if (d === coastDist + 1) isCoast = rnd() < 0.3;
        else isCoast = false;
        terrain[i] = (x === 0 || x === W - 1) ? T.OCEAN : (isCoast ? T.COAST : T.OCEAN);
    }

    // 6b. shallow lines: ocean within `radius` tiles of these corridors becomes coast (island hops)
    for (const line of GEO.shallowLines || []) {
        const r = line.radius || 1.0;
        for (let s = 0; s < line.pts.length - 1; s++) {
            const a = line.pts[s], b = line.pts[s + 1];
            const [ax, ay] = P.toTile(a[0], a[1]);
            const [bx, by] = P.toTile(b[0], b[1]);
            const steps = Math.max(1, Math.ceil(Math.sqrt((bx - ax) ** 2 + ((by - ay) * ROW_SPACING) ** 2) * 2));
            for (let k = 0; k <= steps; k++) {
                const t = k / steps;
                const [xf, yf] = P.toTile(a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t);
                const R = Math.ceil(r) + 1;
                for (let y = Math.round(yf) - R; y <= Math.round(yf) + R; y++) {
                    for (let x = Math.round(xf) - R; x <= Math.round(xf) + R; x++) {
                        if (!inBounds(x, y) || x === 0 || x === W - 1) continue;
                        const dx = (x + 0.5 * (y & 1)) - xf, dy = (y - yf) * ROW_SPACING;
                        if (Math.sqrt(dx * dx + dy * dy) < r && terrain[idx(x, y)] === T.OCEAN) terrain[idx(x, y)] = T.COAST;
                    }
                }
            }
        }
    }

    // 7. mountains and hills
    // Optional per range:
    //   solid: true  - every core hex is a mountain (no 15% hill gaps), so the range is a wall that
    //                  only the passes below open; rivers never run on mountains, so none cross it.
    //   peaks: p     - the share of core hexes that are mountains, the rest hills (default 0.85):
    //                  a low value draws a ridge of hills with a rock here and there.
    //   far: { side: "left" | "right", fringe, hill } - on that side of the line (as drawn, left or
    //                  right of the direction of travel) the fringe runs out to `fringe` (authored
    //                  like `fringe`, i.e. times rangeScale) with a constant hill probability `hill`
    //                  instead of the fading gradient: a band of high hill country of fixed depth in
    //                  hexes at every grid size. The other side keeps the ordinary fringe.
    const ranges = (GEO.ranges || []).map((r) => ({
        core: r.core * rangeScale, fringe: r.fringe * rangeScale, peaks: r.solid ? 1 : (r.peaks === undefined ? 0.85 : r.peaks),
        far: r.far ? { left: r.far.side !== "right", fringe: r.far.fringe * rangeScale, hill: r.far.hill } : null,
        pts: r.pts.map((p) => P.toTile(p[0], p[1]))
    }));
    for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
            const i = idx(x, y);
            if (!isLand[i]) continue;
            const px = x + 0.5 * (y & 1), py = y;
            // A hex inside any range's core takes that core (lowest score wins, as before); a hex
            // only in fringes takes the highest hill chance of any of them, so a far-side hill band
            // is not thinned where another range's fading fringe happens to be nearer.
            let best = null, hillMax = -1;
            for (const r of ranges) {
                let dmin = Infinity, seg = 0;
                const pts = r.pts;
                if (pts.length === 1) {
                    dmin = segDist(px, py, pts[0][0], pts[0][1], pts[0][0], pts[0][1]);
                } else {
                    for (let s = 0; s < pts.length - 1; s++) {
                        const dd = segDist(px, py, pts[s][0], pts[s][1], pts[s + 1][0], pts[s + 1][1]);
                        if (dd < dmin) { dmin = dd; seg = s; }
                    }
                }
                let fringe = r.fringe, hill = null;
                if (r.far && pts.length > 1) {
                    const [a, b] = [pts[seg], pts[seg + 1]];
                    const cross = (b[0] - a[0]) * (py - a[1]) * ROW_SPACING - (b[1] - a[1]) * ROW_SPACING * (px - a[0]);
                    if ((cross > 0) === r.far.left) { fringe = r.far.fringe; hill = r.far.hill; }
                }
                if (dmin < fringe) {
                    const score = dmin < r.core ? -1 : (dmin - r.core) / Math.max(0.01, fringe - r.core);
                    if (!best || score < best.score) best = { score, d: dmin, core: r.core, peaks: r.peaks, hill };
                    if (dmin >= r.core) hillMax = Math.max(hillMax, hill !== null ? hill : 0.15 + 0.65 * (1 - score));
                }
            }
            let t = T.FLAT;
            if (best) {
                if (best.d < best.core) {
                    const roll = rnd();
                    t = roll < best.peaks ? T.MOUNTAIN : T.HILL;
                } else {
                    t = rnd() < hillMax ? T.HILL : T.FLAT;
                }
            } else if (rnd() < (GEO.baseHillProb !== undefined ? GEO.baseHillProb : 0.07)) {
                t = T.HILL;   // random sprinkle of hills away from the ranges
            }
            terrain[i] = t;
        }
    }

    // 7b. flatten areas: turn hills into flat land with a probability (mountains untouched)
    const flatPolys = prepPolys((GEO.flatAreas || []).map((a) => ({ name: a.name, pts: a.pts, prob: a.prob })));
    if (flatPolys.length) {
        for (let i = 0; i < N; i++) {
            if (terrain[i] !== T.HILL) continue;
            for (const p of flatPolys) {
                if (pointInPolygon(lonC[i], latC[i], p) && rnd() < (p.prob === undefined ? 1 : p.prob)) { terrain[i] = T.FLAT; break; }
            }
        }
    }

    // 7b2. rough areas: flat land -> hills with a probability; an optional `biome` is applied to those hexes
    const roughPolys = prepPolys((GEO.roughAreas || []).map((a) => ({ name: a.name, pts: a.pts, prob: a.prob, biome: a.biome })));
    const forcedBiome = new Array(N);
    if (roughPolys.length) {
        for (let i = 0; i < N; i++) {
            if (terrain[i] !== T.FLAT) continue;
            for (const p of roughPolys) {
                if (pointInPolygon(lonC[i], latC[i], p) && rnd() < (p.prob === undefined ? 1 : p.prob)) {
                    terrain[i] = T.HILL;
                    if (p.biome) forcedBiome[i] = p.biome;
                    break;
                }
            }
        }
    }

    // 7c. mountains -> hills inside areas (with a probability) and along passes (polyline + radius)
    const hillPolys = prepPolys((GEO.hillAreas || []).map((a) => ({ name: a.name, pts: a.pts, prob: a.prob })));
    if (hillPolys.length) {
        for (let i = 0; i < N; i++) {
            if (terrain[i] !== T.MOUNTAIN) continue;
            for (const p of hillPolys) {
                if (pointInPolygon(lonC[i], latC[i], p) && rnd() < (p.prob === undefined ? 1 : p.prob)) { terrain[i] = T.HILL; break; }
            }
        }
    }
    // Every hex of a pass corridor is also recorded in passHexes: the river planner keeps rivers
    // out of them, so no river can run through a pass from one side of a range to the other.
    const passHexes = new Set();
    for (const pass of GEO.passes || []) {
        const pts = pass.pts.map((p) => P.toTile(p[0], p[1]));
        const r = (pass.radius || 0.6) * rangeScale;
        for (let y = 0; y < H; y++) {
            for (let x = 0; x < W; x++) {
                const i = idx(x, y);
                if (!isLand[i]) continue;
                if (terrain[i] !== T.MOUNTAIN) {
                    const px = x + 0.5 * (y & 1), py = y;
                    for (let s = 0; s < Math.max(1, pts.length - 1); s++) {
                        const a = pts[s], b = pts[Math.min(s + 1, pts.length - 1)];
                        if (segDist(px, py, a[0], a[1], b[0], b[1]) < r) { passHexes.add(x + "," + y); break; }
                    }
                    continue;
                }
                const px = x + 0.5 * (y & 1), py = y;
                let dmin = Infinity;
                for (let s = 0; s < Math.max(1, pts.length - 1); s++) {
                    const a = pts[s], b = pts[Math.min(s + 1, pts.length - 1)];
                    const dd = segDist(px, py, a[0], a[1], b[0], b[1]);
                    if (dd < dmin) dmin = dd;
                }
                if (dmin < r) { terrain[i] = T.HILL; passHexes.add(x + "," + y); }
            }
        }
    }

    // 7d. low areas: hills and mountains -> flat inside polygons (with a probability). Runs after every
    // other terrain step so a crossing or a plain stays open whatever the ranges and the sprinkle did.
    const lowPolys = prepPolys((GEO.lowAreas || []).map((a) => ({ name: a.name, pts: a.pts, prob: a.prob })));
    if (lowPolys.length) {
        for (let i = 0; i < N; i++) {
            if (terrain[i] !== T.HILL && terrain[i] !== T.MOUNTAIN) continue;
            for (const p of lowPolys) {
                if (pointInPolygon(lonC[i], latC[i], p) && rnd() < (p.prob === undefined ? 1 : p.prob)) { terrain[i] = T.FLAT; break; }
            }
        }
    }

    // 7b. landmass regions (Distant Lands).
    // The engine reads a region change as a distant-lands boundary: land units cannot cross it
    // and civilizations across it cannot be contacted until the Exploration Age. A boundary that
    // runs through connected land is therefore an invisible wall, so regions are assigned to whole
    // water-separated landmasses rather than by longitude. Landmasses containing one of
    // GEO.distantLandsAnchors become "E" (distant lands); everything else is "W" (home lands).
    // With no anchors the whole map is one region and every civilization is reachable overland.
    // Where no sea divides two regions a mountain wall can: GEO.mountainWalls are unbroken,
    // hex-connected lines of mountain from shore to shore (the Caucasus crest). Nothing walks
    // over a mountain, so the region boundary along it is a wall that is really there. For the
    // regions the wall counts as sea; its own hexes take the region of the nearest land.
    const wall = new Uint8Array(N);
    for (const line of GEO.mountainWalls || []) {
        let prev = null;
        const mark = (x, y) => { if (inBounds(x, y) && isLand[idx(x, y)]) { wall[idx(x, y)] = 1; terrain[idx(x, y)] = T.MOUNTAIN; } };
        for (let s = 0; s < line.pts.length - 1; s++) {
            const a = line.pts[s], b = line.pts[s + 1];
            const [ax, ay] = P.toTile(a[0], a[1]);
            const [bx, by] = P.toTile(b[0], b[1]);
            const steps = Math.max(1, Math.ceil(Math.sqrt((bx - ax) ** 2 + ((by - ay) * ROW_SPACING) ** 2) * 4));
            for (let k = 0; k <= steps; k++) {
                const f = k / steps;
                const [x, y] = P.nearestTile(a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f);
                if (prev && (prev[0] !== x || prev[1] !== y) && hexDistance(prev[0], prev[1], x, y) > 1) {
                    for (const n of hexNeighbors(prev[0], prev[1])) {
                        if (hexDistance(n[0], n[1], x, y) <= 1) { mark(n[0], n[1]); break; }
                    }
                }
                mark(x, y);
                prev = [x, y];
            }
        }
    }
    const walkable = wall.some((w) => w) ? isLand.map((l, i) => (l && !wall[i] ? 1 : 0)) : isLand;
    assignLandmassRegions(W, H, idx, walkable, region, P, GEO.distantLandsAnchors);

    // 7c. continents: the first GEO.continents polygon containing the hex centre. Unlike regions
    // these may divide connected land, since a continent border stops nobody.
    const continentPolys = prepPolys(GEO.continents);
    if (continentPolys.length) {
        for (let i = 0; i < N; i++) {
            if (!isLand[i]) continue;
            for (let c = 0; c < continentPolys.length; c++) {
                if (pointInPolygon(lonC[i], latC[i], continentPolys[c])) { continent[i] = c; break; }
            }
        }
    }

    // 8. biomes and rainfall
    for (let i = 0; i < N; i++) {
        const lat = latC[i], lon = lonC[i];
        if (!isLand[i]) { biome[i] = B.MARINE; rain[i] = 100; continue; }
        let b;
        if (lat >= 63) b = B.TUNDRA;
        else if (lat >= 59) b = rnd() < ((lat - 59) / 4) * 0.8 ? B.TUNDRA : B.GRASSLAND;
        else if (lat >= 46) b = B.GRASSLAND;
        else if (lat >= 44) b = rnd() < (46 - lat) / 2 ? B.PLAINS : B.GRASSLAND;
        else if (lat >= 33) b = B.PLAINS;
        else b = B.DESERT;
        for (const p of biomePolys) {
            if (!pointInPolygon(lon, lat, p)) continue;
            if (p.prob === undefined || rnd() < p.prob) b = p.biome;
        }
        if (forcedBiome[i]) b = forcedBiome[i];
        biome[i] = b;

        let r;
        if (lat < 33) r = 15;
        else if (lat < 38) r = 60;
        else if (lat < 44) r = 80;
        else if (lat < 50) r = 110;
        else if (lat < 60) r = 120;
        else r = 100;
        for (const p of rainPolys) if (pointInPolygon(lon, lat, p)) r = p.rain;
        if (b === B.DESERT && r > 30) r = 20;
        rain[i] = r;
    }

    // 8a. circular biome patches (oases, valleys): [lon, lat, radius in tiles, biome, rainfall]
    for (const b of GEO.biomeBlobs || []) {
        const [xf, yf] = P.toTile(b[0], b[1]);
        const r = b[2] * blobScale;
        const [nx, ny] = P.nearestTile(b[0], b[1]);
        const R = Math.ceil(r) + 1;
        for (let y = ny - R; y <= ny + R; y++) {
            for (let x = nx - R; x <= nx + R; x++) {
                if (!inBounds(x, y)) continue;
                const dx = (x + 0.5 * (y & 1)) - xf, dy = (y - yf) * ROW_SPACING;
                const inside = Math.sqrt(dx * dx + dy * dy) < r || (x === nx && y === ny);
                if (!inside || !isLand[idx(x, y)]) continue;
                biome[idx(x, y)] = b[3];
                if (b[4] !== undefined) rain[idx(x, y)] = b[4];
            }
        }
    }

    // 8a2. per-hex patches, surface half: the last word on a single hex. Runs after
    // the biome blobs and before the rivers, so a hand-set terrain cannot break a
    // navigable river chain - the river still carves through.
    const PATCH_TERRAIN = { flat: T.FLAT, hill: T.HILL, hills: T.HILL, mountain: T.MOUNTAIN };
    for (const h of GEO.hexPatches || []) {
        const [x, y] = P.nearestTile(h.lon, h.lat);
        if (!inBounds(x, y)) continue;
        const i = idx(x, y);
        if (h.terrain && isLand[i] && PATCH_TERRAIN[h.terrain] !== undefined) {
            terrain[i] = PATCH_TERRAIN[h.terrain];
        }
        if (h.biome) biome[i] = h.biome;
        if (h.rain !== undefined) rain[i] = h.rain;
    }

    // 8b. hand-placed navigable rivers: a hex-connected chain of river terrain over land
    const riverTiles = [];
    const riverChains = [];   // per river: { name, tiles } in course order (europe-rivers.js paints the river along them)
    for (const river of GEO.rivers || []) {
        let prev = null;
        // `strength` (0..1, default 1): below 0.5 europe-rivers.js paints the course as a minor
        // river rather than a navigable one.
        const chain = { name: river.name, strength: river.strength, navigable: river.navigable, mouth: river.mouth, tiles: [] };
        riverChains.push(chain);
        // A minor river is a stream, not a valley, so it keeps the ground it crosses: a hill on its
        // course stays a hill instead of being cut down to river flat. That is not cosmetic. The
        // engine refuses any NoRiver="false" feature - Gullfoss, Iguazu Falls - on a hex that is
        // not on a river, and a hand-drawn course was the one thing on this map that could put a
        // river on a hill, except that rasterizing it flattened the hill first. Only low-strength
        // rivers are treated this way, so the navigable courses are untouched.
        const minor = river.strength !== undefined && river.strength < 0.5;
        const onChain = new Set();
        const markRiver = (x, y) => {
            if (!inBounds(x, y) || x < 1 || x >= W - 1) return;
            const i = idx(x, y);
            if (!isLand[i] || onChain.has(i)) return;
            if (minor && terrain[i] === T.HILL) { onChain.add(i); riverTiles.push([x, y]); chain.tiles.push([x, y]); return; }
            if (terrain[i] === T.RIVER) return;
            terrain[i] = T.RIVER; onChain.add(i); riverTiles.push([x, y]); chain.tiles.push([x, y]);
        };
        for (let s = 0; s < river.pts.length - 1; s++) {
            const a = river.pts[s], b = river.pts[s + 1];
            const [ax, ay] = P.toTile(a[0], a[1]);
            const [bx, by] = P.toTile(b[0], b[1]);
            const steps = Math.max(1, Math.ceil(Math.sqrt((bx - ax) ** 2 + ((by - ay) * ROW_SPACING) ** 2) * 4));
            for (let k = 0; k <= steps; k++) {
                const t = k / steps;
                const [x, y] = P.nearestTile(a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t);
                if (prev && (prev[0] !== x || prev[1] !== y) && hexDistance(prev[0], prev[1], x, y) > 1) {
                    for (const n of hexNeighbors(prev[0], prev[1])) {
                        if (hexDistance(n[0], n[1], x, y) <= 1) { markRiver(n[0], n[1]); break; }
                    }
                }
                markRiver(x, y);
                prev = [x, y];
            }
        }
    }

    // 9. volcanoes and start sites
    const findLandTile = (lon, lat, maxR, allowMountain) => {
        const [nx, ny] = P.nearestTile(lon, lat);
        let best = null, bestD = Infinity;
        for (let y = ny - maxR; y <= ny + maxR; y++) {

    for (const st of starts) { if(!st.t) continue; const [cx, cy] = centerOf(st.t[0], st.t[1]); ctx.strokeStyle='#fff'; ctx.beginPath(); ctx.arc(cx,cy,s*0.8,0,6.3); ctx.stroke(); ctx.fillStyle='#fff'; ctx.fillText(zoom >= 1.6 || shot ? st.civ : st.civ.substring(0,6), cx+s, cy+fs*0.35); }
    if (zoom >= 2.2 && !shot) { // hex coordinates when zoomed in
      ctx.font = Math.max(3, 7 / zoom) + 'px monospace'; ctx.fillStyle = 'rgba(255,255,255,0.55)';
      const [x0, y0] = worldToHex(-panX/zoom, -panY/zoom), [x1, y1] = worldToHex((cv.width-panX)/zoom, (cv.height-panY)/zoom);
      for (let y = Math.max(0, y1-1); y <= Math.min(H-1, y0+1); y++) for (let x = Math.max(0, x0-1); x <= Math.min(W-1, x1+1); x++) { const [cx, cy] = centerOf(x, y); ctx.fillText(x+','+y, cx - s*0.7, cy + s*0.9); }
    }
    if (hover) { const [cx, cy] = centerOf(hover[0], hover[1]); ctx.strokeStyle='#ffd23f'; ctx.lineWidth = 2/zoom; ctx.beginPath(); for (let k=0;k<6;k++){ const a=(60*k-30)*Math.PI/180; const px=cx+s*Math.cos(a), py=cy+s*Math.sin(a); if(k===0)ctx.moveTo(px,py); else ctx.lineTo(px,py);} ctx.closePath(); ctx.stroke(); }
    // caption and legend in screen space
    ctx.setTransform(1,0,0,1,0,0);
    if (title) { ctx.font = 'bold 28px sans-serif'; const tw = ctx.measureText(title).width; ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(12, cv.height - 56, tw + 24, 44); ctx.fillStyle = '#fff'; ctx.fillText(title, 24, cv.height - 24); }
    if (showContinents && continentLayer) {
      const items = GEO.continents.map((c, k) => [continentColors[k % continentColors.length], c.name]);
      // in the open Atlantic west of France, clear of Iceland, Ireland and Iberia
      const ly = shot ? Math.round(cv.height * 0.33) : 12;
      ctx.font = '15px sans-serif'; ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(12, ly, 292, 18 + (items.length + 1)*24);
      items.forEach((it, k) => { ctx.fillStyle = it[0]; ctx.fillRect(24, ly + 10 + k*24, 20, 20); ctx.fillStyle = '#fff'; ctx.fillText(it[1], 54, ly + 25 + k*24); });
      const ky = ly + 10 + items.length*24; ctx.fillStyle = '#777'; ctx.fillRect(24, ky, 20, 20); ctx.save(); ctx.beginPath(); ctx.rect(24, ky, 20, 20); ctx.clip(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
      for (let d = -3; d <= 3; d++) { ctx.beginPath(); ctx.moveTo(24 + d*7, ky + 20); ctx.lineTo(44 + d*7, ky); ctx.stroke(); } ctx.restore();
      ctx.fillStyle = '#fff'; ctx.fillText('striped = Distant Lands', 54, ky + 15);
    }
    if (regionLayer) {
      const items = [['rgba(255,150,30,0.9)', 'Home lands (west landmass)'], ['rgba(90,60,255,0.9)', 'Distant lands (east landmass)']];
      ctx.font = '22px sans-serif'; ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(12, 12, 360, 84);
      items.forEach((it, k) => { ctx.fillStyle = it[0]; ctx.fillRect(28, 26 + k*36, 26, 26); ctx.fillStyle = '#fff'; ctx.fillText(it[1], 66, 47 + k*36); });
    }
  }
  function worldToHex(wx, wy) { // nearest hex to a world point (offset rows)
    const y = Math.round((H-1) - (wy - 2 - hh/2) / (0.75*hh));
    const x = Math.round((wx - 2 - w/2) / w - 0.5*(y&1));
    return [x, y];
  }
  function describe(x, y) {
    if (x < 0 || x >= W || y < 0 || y >= H) return '';
    const i = g.idx(x, y); const t = g.terrain[i];
    let d = `hex ${x},${y}   lon ${g.lonC[i].toFixed(1)}  lat ${g.latC[i].toFixed(1)}   ${terrainName[t]}`;
    if (t !== T.OCEAN && t !== T.COAST) d += `  ${biomeName[g.biome[i]]||g.biome[i]}  rain ${g.rain[i]}  region ${g.region[i]}${g.continent[i] >= 0 && GEO.continents ? '  continent ' + GEO.continents[g.continent[i]].name : ''}`;
    if (startAt[x+','+y]) d += `   start: ${startAt[x+','+y]}`;
    if (volcanoAt[x+','+y]) d += `   volcano: ${volcanoAt[x+','+y]}`;
    return d;
  }
  cv.addEventListener('wheel', (e) => {
    e.preventDefault();
    const r = cv.getBoundingClientRect(); const mx = e.clientX - r.left, my = e.clientY - r.top;
    const f = e.deltaY < 0 ? 1.2 : 1/1.2; const nz = Math.min(12, Math.max(0.2, zoom * f));
    panX = mx - (mx - panX) * (nz / zoom); panY = my - (my - panY) * (nz / zoom); zoom = nz; draw();
  }, { passive: false });
  let drag = null;
  cv.addEventListener('mousedown', (e) => { drag = { x: e.clientX, y: e.clientY, px: panX, py: panY }; });
  window.addEventListener('mouseup', () => { drag = null; });
  cv.addEventListener('mousemove', (e) => {
    if (drag) { panX = drag.px + (e.clientX - drag.x); panY = drag.py + (e.clientY - drag.y); draw(); return; }
    const r = cv.getBoundingClientRect(); const hx = worldToHex((e.clientX - r.left - panX)/zoom, (e.clientY - r.top - panY)/zoom);
    if (!hover || hover[0] !== hx[0] || hover[1] !== hx[1]) { hover = hx; document.getElementById('hover').textContent = describe(hx[0], hx[1]); draw(); }
  });
  cv.addEventListener('mouseleave', () => { hover = null; draw(); });
  const cb = document.getElementById('continents'); if (cb) cb.onclick = () => { showContinents = !showContinents; draw(); };
  document.getElementById('sites').onclick = () => { showSites = !showSites; draw(); };
  document.getElementById('zin').onclick = () => { const nz = Math.min(12, zoom*1.5); panX = cv.width/2 - (cv.width/2 - panX)*(nz/zoom); panY = cv.height/2 - (cv.height/2 - panY)*(nz/zoom); zoom = nz; draw(); };
  document.getElementById('zout').onclick = () => { const nz = Math.max(0.2, zoom/1.5); panX = cv.width/2 - (cv.width/2 - panX)*(nz/zoom); panY = cv.height/2 - (cv.height/2 - panY)*(nz/zoom); zoom = nz; draw(); };
  document.getElementById('zfit').onclick = fit;
  window.addEventListener('resize', fit);
  fit();
})();
</script>
