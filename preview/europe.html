// europe-raster.js
// Turns the lon/lat geography in europe-geo.js into a hex grid.
// Pure JavaScript: no engine calls, so the same code runs in the game and in a browser preview.

const T = { OCEAN: 0, COAST: 1, FLAT: 2, HILL: 3, MOUNTAIN: 4, RIVER: 5 };
const B = { MARINE: "M", GRASSLAND: "G", PLAINS: "P", DESERT: "D", TUNDRA: "T", TROPICAL: "R" };

const DEG = Math.PI / 180;
const ROW_SPACING = 0.866; // physical distance between hex rows, in column units

function makeProjection(GEO, W, H) {
    // Latitude mapping: optional piecewise-linear control points [lat, rowFraction] (ascending).
    const ctrl = GEO.latControl || [[GEO.latBottom, 0], [GEO.latTop, 1]];
    const fracToLat = (f) => {
        if (f <= ctrl[0][1]) return ctrl[0][0];
        for (let i = 1; i < ctrl.length; i++) {
            if (f <= ctrl[i][1]) {
                const t = (f - ctrl[i - 1][1]) / (ctrl[i][1] - ctrl[i - 1][1]);
                return ctrl[i - 1][0] + t * (ctrl[i][0] - ctrl[i - 1][0]);
            }
        }
        return ctrl[ctrl.length - 1][0];
    };
    const latToFrac = (lat) => {
        if (lat <= ctrl[0][0]) return ctrl[0][1] + (lat - ctrl[0][0]) * (ctrl[1][1] - ctrl[0][1]) / (ctrl[1][0] - ctrl[0][0]);
        for (let i = 1; i < ctrl.length; i++) {
            if (lat <= ctrl[i][0]) {
                const t = (lat - ctrl[i - 1][0]) / (ctrl[i][0] - ctrl[i - 1][0]);
                return ctrl[i - 1][1] + t * (ctrl[i][1] - ctrl[i - 1][1]);
            }
        }
        const n = ctrl.length - 1;
        return ctrl[n][1] + (lat - ctrl[n][0]) * (ctrl[n][1] - ctrl[n - 1][1]) / (ctrl[n][0] - ctrl[n - 1][0]);
    };
    const dLat = (GEO.latTop - GEO.latBottom) / (H - 1);   // average, kept for reference
    const cosRef = Math.cos(GEO.latRef * DEG);
    const latOf = (y) => fracToLat(y / (H - 1));
    const dLatAt = (y) => {
        const y0 = Math.max(0, y - 1), y1 = Math.min(H - 1, y + 1);
        return (latOf(y1) - latOf(y0)) / Math.max(1, y1 - y0);
    };
    const dLonAt = (lat) => (GEO.spanRef / W) * Math.pow(cosRef / Math.max(0.15, Math.cos(lat * DEG)), GEO.scaleExp);
    // Optional horizontal squeeze east of a longitude ("lonSqueeze"): each screen degree east of
    // `from` covers k geographic degrees, so the east takes fewer columns.
    const lq = GEO.lonSqueeze;
    // Western squeeze ("lonSqueezeWest"): west of `from`, each screen degree covers k geographic
    // degrees, but only south of latNone (full strength at latFull and below), so West Africa fits.
    // lonSqueezeWest.segments: [[fromLon, k], ...] westwards (first entry is the easternmost edge);
    // legacy form {from, k} is one segment. Strength blends from 1 at latNone to full at latFull.
    const lw = GEO.lonSqueezeWest;
    const lwSegs = !lw ? [] : (lw.segments || [[lw.from, lw.k]]);
    const lwFrom = lwSegs.length ? lwSegs[0][0] : -1e9;
    const wBlend = (tLat) => {
        if (!lw) return 0;
        if (tLat >= lw.latNone) return 0;
        if (tLat <= lw.latFull) return 1;
        return (lw.latNone - tLat) / (lw.latNone - lw.latFull);
    };
    const kSeg = (i, tLat) => 1 + (lwSegs[i][1] - 1) * wBlend(tLat);
    // screen -> geo: walk the segments westwards
    const geoFromScreenWest = (s, tLat) => {
        let sEdge = lwFrom, gEdge = lwFrom;
        for (let i = 0; i < lwSegs.length; i++) {
            const k = kSeg(i, tLat);
            const gNext = i + 1 < lwSegs.length ? lwSegs[i + 1][0] : -1e9;   // geo where the next segment starts
            const sNext = sEdge - (gEdge - gNext) / k;                         // its screen position
            if (s >= sNext) return gEdge - (sEdge - s) * k;
            sEdge = sNext; gEdge = gNext;
        }
        return gEdge - (sEdge - s);
    };
    const screenFromGeoWest = (g, tLat) => {
        let sEdge = lwFrom, gEdge = lwFrom;
        for (let i = 0; i < lwSegs.length; i++) {
            const k = kSeg(i, tLat);
            const gNext = i + 1 < lwSegs.length ? lwSegs[i + 1][0] : -1e9;
            if (g >= gNext) return sEdge - (gEdge - g) / k;
            sEdge = sEdge - (gEdge - gNext) / k; gEdge = gNext;
        }
        return sEdge - (gEdge - g);
    };
    const kWestAt = (g, tLat) => { for (let i = lwSegs.length - 1; i >= 0; i--) if (g < lwSegs[i][0]) return kSeg(i, tLat); return 1; };
    const geoFromScreen = (s, tLat) => {
        if (lq && s > lq.from) return lq.from + (s - lq.from) * lq.k;
        if (lwSegs.length && s < lwFrom) return geoFromScreenWest(s, tLat);
        return s;
    };
    const screenFromGeo = (g, tLat) => {
        if (lq && g > lq.from) return lq.from + (g - lq.from) / lq.k;
        if (lwSegs.length && g < lwFrom) return screenFromGeoWest(g, tLat);
        return g;
    };
    const lonScaleAt = (lon, tLat) => (lq && lon > lq.from) ? lq.k : kWestAt(lon, tLat);   // geographic degrees per screen degree
    const lonOf = (x, y) => geoFromScreen(GEO.lonCenter + (x + 0.5 * (y & 1) - (W - 1) / 2) * dLonAt(latOf(y)), latOf(y));

    // Optional longitude-dependent vertical remap south of a pivot latitude ("southWarp").
    // westMap is a list of [geoLat, tileLat] control points used in the west (lon <= lonWestEnd);
    // it blends to the identity mapping at lon >= lonEastStart. Must end at [latPivot, latPivot].
    const sw = GEO.southWarp;
    // zones: each has a longitude window (ramp in from lonStart to lonFullStart, full weight until
    // lonFullEnd, ramp out to lonEnd) and its own [geoLat, tileLat] map. Legacy form: westMap only.
    const zones = !sw ? [] : (sw.zones || [{ lonStart: -1000, lonFullStart: -999, lonFullEnd: sw.lonWestEnd, lonEnd: sw.lonEastStart, map: sw.westMap }]);
    const zoneWeight = (z, lon) => {
        if (lon <= z.lonStart || lon >= z.lonEnd) return 0;
        if (lon < z.lonFullStart) return (lon - z.lonStart) / (z.lonFullStart - z.lonStart);
        if (lon <= z.lonFullEnd) return 1;
        return 1 - (lon - z.lonFullEnd) / (z.lonEnd - z.lonFullEnd);
    };
    const kAt = (lon) => {            // total remap weight at this longitude (0 = plain projection)
        let s = 0;
        for (const z of zones) s += zoneWeight(z, lon);
        return Math.min(1, s);
    };
    const piecewise = (pts, v, i0, i1) => {   // interpolate column i1 from column i0
        if (v <= pts[0][i0]) return pts[0][i1] + (v - pts[0][i0]) * (pts[1][i1] - pts[0][i1]) / (pts[1][i0] - pts[0][i0]);
        for (let i = 1; i < pts.length; i++) {
            if (v <= pts[i][i0]) {
                const t = (v - pts[i - 1][i0]) / (pts[i][i0] - pts[i - 1][i0]);
                return pts[i - 1][i1] + t * (pts[i][i1] - pts[i - 1][i1]);
            }
        }
        return pts[pts.length - 1][i1];
    };
    // geographic latitude -> tile latitude at this longitude
    const geoToTileLat = (lon, geoLat) => {
        if (!sw || geoLat >= sw.latPivot) return geoLat;
        let acc = 0, wsum = 0;
        for (const z of zones) {
            const w = zoneWeight(z, lon);
            if (w > 0) { acc += w * piecewise(z.map, geoLat, 0, 1); wsum += w; }
        }
        if (wsum <= 0) return geoLat;
        if (wsum > 1) { acc /= wsum; wsum = 1; }
        return geoLat * (1 - wsum) + acc;
    };
    // tile latitude (row) -> geographic latitude at this longitude (numeric inverse, monotonic)
    const tileToGeoLat = (lon, tileLat) => {
        if (!sw || tileLat >= sw.latPivot) return tileLat;
        if (kAt(lon) <= 0) return tileLat;
        let lo = -40, hi = sw.latPivot;
        for (let i = 0; i < 40; i++) {
            const mid = (lo + hi) / 2;
            if (geoToTileLat(lon, mid) < tileLat) lo = mid; else hi = mid;
        }
        return (lo + hi) / 2;
    };
    const geoLatAt = (x, y) => tileToGeoLat(lonOf(x, y), latOf(y));

    // Continuous tile coordinates (xf includes the odd-row half shift). Input is geographic lon/lat.
    const toTile = (lon, lat) => {
        const tLat = geoToTileLat(lon, lat);
        const yf = latToFrac(tLat) * (H - 1);
        const xf = (screenFromGeo(lon, tLat) - GEO.lonCenter) / dLonAt(tLat) + (W - 1) / 2;
        return [xf, yf];
    };
    const nearestTile = (lon, lat) => {
        const [xf, yf] = toTile(lon, lat);
        const y = Math.round(yf);
        const x = Math.round(xf - 0.5 * (y & 1));
        return [x, y];
    };
    return { W, H, dLat, dLatAt, latOf, lonOf, dLonAt, toTile, nearestTile, kAt, geoLatAt, tileToGeoLat, lonScaleAt };
}

// ---- geometry helpers ------------------------------------------------------

function bbox(pts) {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const p of pts) {
        if (p[0] < minX) minX = p[0];
        if (p[0] > maxX) maxX = p[0];
        if (p[1] < minY) minY = p[1];
        if (p[1] > maxY) maxY = p[1];
    }
    return [minX, minY, maxX, maxY];
}

function pointInPolygon(lon, lat, poly) {
    const bb = poly.bb;
    if (lon < bb[0] || lon > bb[2] || lat < bb[1] || lat > bb[3]) return false;
    const pts = poly.pts;
    let inside = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
        const xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
        if ((yi > lat) !== (yj > lat)) {
            const xInt = xi + (lat - yi) * (xj - xi) / (yj - yi);
            if (lon < xInt) inside = !inside;
        }
    }
    return inside;
}

function prepPolys(list) {
    return (list || []).map((p) => ({ name: p.name, pts: p.pts, bb: bbox(p.pts), biome: p.biome, rain: p.rain, prob: p.prob, coastDist: p.coastDist }));
}

function inAny(lon, lat, polys) {
    for (const p of polys) if (pointInPolygon(lon, lat, p)) return true;
    return false;
}

// distance from point to segment, in tile units (rows scaled by ROW_SPACING)
function segDist(px, py, ax, ay, bx, by) {
    const sy = ROW_SPACING;
    const vx = bx - ax, vy = (by - ay) * sy;
    const wx = px - ax, wy = (py - ay) * sy;
    const len2 = vx * vx + vy * vy;
    let t = len2 > 0 ? (wx * vx + wy * vy) / len2 : 0;
    if (t < 0) t = 0; else if (t > 1) t = 1;
    const dx = wx - t * vx, dy = wy - t * vy;
    return Math.sqrt(dx * dx + dy * dy);
}

function hexNeighbors(x, y) {
    if (y & 1) {
        return [[x + 1, y], [x - 1, y], [x + 1, y + 1], [x, y + 1], [x + 1, y - 1], [x, y - 1]];
    }
    return [[x + 1, y], [x - 1, y], [x, y + 1], [x - 1, y + 1], [x, y - 1], [x - 1, y - 1]];
}

function hexDistance(x1, y1, x2, y2) {
    const q1 = x1 - (y1 - (y1 & 1)) / 2, r1 = y1;
    const q2 = x2 - (y2 - (y2 & 1)) / 2, r2 = y2;
    const dq = q1 - q2, dr = r1 - r2, ds = (-q1 - r1) - (-q2 - r2);
    return Math.max(Math.abs(dq), Math.abs(dr), Math.abs(ds));
}

// ---- main ------------------------------------------------------------------

function buildEuropeGrid(W, H, GEO, rnd) {
    const P = makeProjection(GEO, W, H);
    const N = W * H;
    const rangeScale = GEO.rangeScale || 1;
    const blobScale = GEO.blobScale || 1;
    const idx = (x, y) => y * W + x;
    const inBounds = (x, y) => x >= 0 && x < W && y >= 0 && y < H;

    const landPolys = prepPolys(GEO.land);
    const waterPolys = prepPolys(GEO.water);
    const shallowPolys = prepPolys(GEO.shallow);
    const biomePolys = prepPolys(GEO.biomeAreas);
    const rainPolys = prepPolys(GEO.rainAreas);

    const isLand = new Uint8Array(N);
    const isLake = new Uint8Array(N);   // water painted as a lake: always shallow
    const terrain = new Uint8Array(N);
    const biome = new Array(N);
    const rain = new Uint16Array(N);
    const region = new Array(N);   // "W" or "E"
    const lonC = new Float32Array(N);
    const latC = new Float32Array(N);

    // sample offsets around a hex center, in tile units
    const SAMPLE_R = 0.42;
    const samples = [];
    for (let k = 0; k < 6; k++) {
        const a = (k * 60 + 30) * DEG;
        samples.push([SAMPLE_R * Math.cos(a), SAMPLE_R * Math.sin(a) / ROW_SPACING]);
    }

    // 1. land vs water from polygons
    for (let y = 0; y < H; y++) {
        const tileLat = P.latOf(y);
        const dLonTile = P.dLonAt(tileLat);

  const s = 6, w = Math.sqrt(3)*s, hh = 2*s;
  const worldW = (W+1)*w + 4, worldH = (H+1)*0.75*hh + hh + 4;
  const centerOf = (x, y) => [ (x + 0.5*(y&1)) * w + w/2 + 2, (H-1-y) * 0.75*hh + hh/2 + 2 ];
  const colors = { ocean:'#0f2a4a', coast:'#3d7fb8', G:'#4f9a3a', P:'#b3a45c', D:'#e2cf8e', T:'#a9b6bd', R:'#2f7a3a', river:'#5fb3e6' };
  const biomeName = { M:'marine', G:'grassland', P:'plains', D:'desert', T:'tundra', R:'tropical' };
  const terrainName = ['ocean','coast','flat','hills','mountain','navigable river'];

  // ---- counts and text dump ----
  let counts = {land:0, water:0, mtn:0, hill:0, coast:0, ocean:0, river:0, G:0,P:0,D:0,T:0,R:0};
  const rows = [];
  for (let y = H-1; y >= 0; y--) {
    let line = '';
    for (let x = 0; x < W; x++) {
      const i = g.idx(x,y); const t = g.terrain[i]; const b = g.biome[i]; let ch;
      if (t === T.OCEAN) { ch='.'; counts.ocean++; counts.water++; }
      else if (t === T.COAST) { ch=','; counts.coast++; counts.water++; }
      else if (t === T.RIVER) { ch='V'; counts.river++; counts.land++; }
      else { counts.land++; counts[b]=(counts[b]||0)+1; ch = b.toLowerCase(); if (t === T.HILL) { ch = b; counts.hill++; } if (t === T.MOUNTAIN) { ch='^'; counts.mtn++; } }
      line += ch;
    }
    rows.push(line);
  }
  document.getElementById('info').textContent = `${W}x${H}  built in ${(t1-t0).toFixed(0)} ms  land=${counts.land} (${(100*counts.land/(W*H)).toFixed(1)}%) coast=${counts.coast} ocean=${counts.ocean} mtn=${counts.mtn} hill=${counts.hill} rivers=${counts.river} G=${counts.G} P=${counts.P} D=${counts.D} T=${counts.T} R=${counts.R}  missing starts: ${starts.filter(s=>!s.t).map(s=>s.civ).join(',')||'none'}`;
  document.getElementById('ascii').textContent = rows.map((r,i)=>String(H-1-i).padStart(2,'0')+' '+r).join('\n');

  // ---- pre-render the whole map once into an offscreen canvas ----
  const off = document.createElement('canvas'); off.width = Math.ceil(worldW); off.height = Math.ceil(worldH);
  const octx = off.getContext('2d');
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = g.idx(x,y); const t = g.terrain[i]; const b = g.biome[i];
      let fill = t === T.OCEAN ? colors.ocean : t === T.COAST ? colors.coast : t === T.RIVER ? colors.river : (colors[b] || '#f0f');
      const [cx, cy] = centerOf(x, y);
      octx.beginPath();
      for (let k=0;k<6;k++){ const a=(60*k-30)*Math.PI/180; const px=cx+s*Math.cos(a), py=cy+s*Math.sin(a); if(k===0)octx.moveTo(px,py); else octx.lineTo(px,py);} octx.closePath();
      octx.fillStyle = fill; octx.fill();
      octx.strokeStyle = 'rgba(0,0,0,0.15)'; octx.lineWidth = 0.5; octx.stroke();
      if (t === T.HILL) { octx.fillStyle='rgba(0,0,0,0.35)'; octx.beginPath(); octx.arc(cx, cy, s*0.35, 0, 6.3); octx.fill(); }
      if (t === T.MOUNTAIN) { octx.fillStyle='#4a3b32'; octx.beginPath(); octx.moveTo(cx-s*0.6, cy+s*0.5); octx.lineTo(cx, cy-s*0.6); octx.lineTo(cx+s*0.6, cy+s*0.5); octx.closePath(); octx.fill(); }
    }
  }
  for (const v of g.volcanoes) { const [cx, cy] = centerOf(v.x, v.y); octx.fillStyle='#ff3b1f'; octx.beginPath(); octx.arc(cx,cy,s*0.4,0,6.3); octx.fill(); }

  // ---- viewport with zoom and pan ----
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let zoom = 1, panX = 0, panY = 0, hover = null;
  function fit() {
    cv.width = Math.max(600, window.innerWidth - 24); cv.height = Math.max(400, Math.min(window.innerHeight - 90, Math.round(cv.width * worldH / worldW)));
    zoom = Math.min(cv.width / worldW, cv.height / worldH); panX = (cv.width - worldW*zoom)/2; panY = (cv.height - worldH*zoom)/2; draw();
  }
  let showSites = true;
  function draw() {
    ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle = '#111'; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.setTransform(zoom,0,0,zoom,panX,panY);
    ctx.imageSmoothingEnabled = zoom < 1;
    ctx.drawImage(off, 0, 0);
    // labels keep a readable screen size
    const fs = Math.max(9, 11 / zoom); ctx.font = fs + 'px sans-serif'; ctx.lineWidth = 2 / zoom;
    if (showSites) for (const si of sites) { if(!si.t) continue; if (startAt[si.t[0]+','+si.t[1]]) continue;
      const [cx, cy] = centerOf(si.t[0], si.t[1]); ctx.strokeStyle='#ffb454'; ctx.beginPath(); ctx.arc(cx,cy,s*0.55,0,6.3); ctx.stroke();
      if (zoom >= 1.1) { ctx.fillStyle='#ffb454'; ctx.fillText(si.name, cx+s*0.8, cy+fs*0.35); } }
    for (const st of starts) { if(!st.t) continue; const [cx, cy] = centerOf(st.t[0], st.t[1]); ctx.strokeStyle='#fff'; ctx.beginPath(); ctx.arc(cx,cy,s*0.8,0,6.3); ctx.stroke(); ctx.fillStyle='#fff'; ctx.fillText(zoom >= 1.6 ? st.civ : st.civ.substring(0,6), cx+s, cy+fs*0.35); }
    if (zoom >= 2.2) { // hex coordinates when zoomed in
      ctx.font = Math.max(3, 7 / zoom) + 'px monospace'; ctx.fillStyle = 'rgba(255,255,255,0.55)';
      const [x0, y0] = worldToHex(-panX/zoom, -panY/zoom), [x1, y1] = worldToHex((cv.width-panX)/zoom, (cv.height-panY)/zoom);
      for (let y = Math.max(0, y1-1); y <= Math.min(H-1, y0+1); y++) for (let x = Math.max(0, x0-1); x <= Math.min(W-1, x1+1); x++) { const [cx, cy] = centerOf(x, y); ctx.fillText(x+','+y, cx - s*0.7, cy + s*0.9); }
    }
    if (hover) { const [cx, cy] = centerOf(hover[0], hover[1]); ctx.strokeStyle='#ffd23f'; ctx.lineWidth = 2/zoom; ctx.beginPath(); for (let k=0;k<6;k++){ const a=(60*k-30)*Math.PI/180; const px=cx+s*Math.cos(a), py=cy+s*Math.sin(a); if(k===0)ctx.moveTo(px,py); else ctx.lineTo(px,py);} ctx.closePath(); ctx.stroke(); }
  }
  function worldToHex(wx, wy) { // nearest hex to a world point (offset rows)
    const y = Math.round((H-1) - (wy - 2 - hh/2) / (0.75*hh));
    const x = Math.round((wx - 2 - w/2) / w - 0.5*(y&1));
    return [x, y];
  }
  function describe(x, y) {
    if (x < 0 || x >= W || y < 0 || y >= H) return '';
    const i = g.idx(x, y); const t = g.terrain[i];
    let d = `hex ${x},${y}   lon ${g.lonC[i].toFixed(1)}  lat ${g.latC[i].toFixed(1)}   ${terrainName[t]}`;
    if (t !== T.OCEAN && t !== T.COAST) d += `  ${biomeName[g.biome[i]]||g.biome[i]}  rain ${g.rain[i]}  region ${g.region[i]}`;
    if (startAt[x+','+y]) d += `   start: ${startAt[x+','+y]}`;
    if (volcanoAt[x+','+y]) d += `   volcano: ${volcanoAt[x+','+y]}`;
    return d;
  }
  cv.addEventListener('wheel', (e) => {
    e.preventDefault();
    const r = cv.getBoundingClientRect(); const mx = e.clientX - r.left, my = e.clientY - r.top;
    const f = e.deltaY < 0 ? 1.2 : 1/1.2; const nz = Math.min(12, Math.max(0.2, zoom * f));
    panX = mx - (mx - panX) * (nz / zoom); panY = my - (my - panY) * (nz / zoom); zoom = nz; draw();
  }, { passive: false });
  let drag = null;
  cv.addEventListener('mousedown', (e) => { drag = { x: e.clientX, y: e.clientY, px: panX, py: panY }; });
  window.addEventListener('mouseup', () => { drag = null; });
  cv.addEventListener('mousemove', (e) => {
    if (drag) { panX = drag.px + (e.clientX - drag.x); panY = drag.py + (e.clientY - drag.y); draw(); return; }
    const r = cv.getBoundingClientRect(); const hx = worldToHex((e.clientX - r.left - panX)/zoom, (e.clientY - r.top - panY)/zoom);
    if (!hover || hover[0] !== hx[0] || hover[1] !== hx[1]) { hover = hx; document.getElementById('hover').textContent = describe(hx[0], hx[1]); draw(); }
  });
  cv.addEventListener('mouseleave', () => { hover = null; draw(); });
  document.getElementById('sites').onclick = () => { showSites = !showSites; draw(); };
  document.getElementById('zin').onclick = () => { const nz = Math.min(12, zoom*1.5); panX = cv.width/2 - (cv.width/2 - panX)*(nz/zoom); panY = cv.height/2 - (cv.height/2 - panY)*(nz/zoom); zoom = nz; draw(); };
  document.getElementById('zout').onclick = () => { const nz = Math.max(0.2, zoom/1.5); panX = cv.width/2 - (cv.width/2 - panX)*(nz/zoom); panY = cv.height/2 - (cv.height/2 - panY)*(nz/zoom); zoom = nz; draw(); };
  document.getElementById('zfit').onclick = fit;
  window.addEventListener('resize', fit);
  fit();
})();
</script>
