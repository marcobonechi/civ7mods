<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Hippodrome: oval arena, tiered stands, spina with obelisk and serpent column, kathisma at the far end. -->
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eedcb0"/><stop offset="1" stop-color="#c4a068"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b98a4e"/><stop offset="1" stop-color="#6a4522"/></linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dcb87c"/><stop offset="1" stop-color="#b08750"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4dc86"/><stop offset="1" stop-color="#b8862a"/></linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.35"/></linearGradient>
  </defs>
  <ellipse cx="128" cy="184" rx="118" ry="24" fill="#000" opacity="0.3"/>
  <!-- outer wall -->
  <path d="M16,132 L16,166 A112,52 0 0 0 240,166 L240,132 A112,52 0 0 1 16,132 Z" fill="url(#wall)"/>
  <path d="M228.7,177.8 v-8 a4.5,4.5 0 0 1 9,0 v8 z M216.4,189.1 v-8 a4.5,4.5 0 0 1 9,0 v8 z M198.4,198.6 v-8 a4.5,4.5 0 0 1 9,0 v8 z M176.1,205.9 v-8 a4.5,4.5 0 0 1 9,0 v8 z M150.6,210.5 v-8 a4.5,4.5 0 0 1 9,0 v8 z M123.5,212.0 v-8 a4.5,4.5 0 0 1 9,0 v8 z M96.4,210.5 v-8 a4.5,4.5 0 0 1 9,0 v8 z M70.9,205.9 v-8 a4.5,4.5 0 0 1 9,0 v8 z M48.6,198.6 v-8 a4.5,4.5 0 0 1 9,0 v8 z M30.6,189.1 v-8 a4.5,4.5 0 0 1 9,0 v8 z M18.3,177.8 v-8 a4.5,4.5 0 0 1 9,0 v8 z" fill="#33200f"/>
  <!-- cornice -->
  <path d="M16,132 A112,52 0 0 0 240,132" fill="none" stroke="#e8cf9a" stroke-width="3"/>
  <!-- stands: stepped rings -->
  <ellipse cx="128" cy="132" rx="112" ry="52" fill="url(#stone)"/>
  <ellipse cx="128" cy="132" rx="102" ry="47" fill="#b8925a"/>
  <ellipse cx="128" cy="132" rx="98" ry="45" fill="#e6cc96"/>
  <ellipse cx="128" cy="132" rx="90" ry="41" fill="#b08a54"/>
  <ellipse cx="128" cy="132" rx="86" ry="39" fill="#e0c48c"/>
  <ellipse cx="128" cy="132" rx="78" ry="35" fill="#a8824e"/>
  <!-- aisles -->
  <g stroke="#6e4c26" stroke-width="2" opacity="0.6" fill="none">
    <path d="M128,80 L128,99 M128,184 L128,165 M16,132 L54,132 M240,132 L202,132"/>
    <path d="M49,95 L76,108 M207,95 L180,108 M49,169 L76,156 M207,169 L180,156"/>
  </g>
  <!-- track, sunk below the stands -->
  <ellipse cx="128" cy="134" rx="74" ry="33" fill="#5a3f22"/>
  <ellipse cx="128" cy="137" rx="72" ry="31" fill="url(#sand)"/>
  <!-- spina -->
  <rect x="84" y="132" width="88" height="12" rx="5" fill="#6e4f33"/>
  <rect x="84" y="128" width="88" height="7" rx="3" fill="#b09062"/>
  <circle cx="92" cy="131" r="4.5" fill="#d6b25a"/>
  <circle cx="164" cy="131" r="4.5" fill="#d6b25a"/>
  <!-- obelisk -->
  <path d="M123,130 L133,130 L130,72 L126,72 Z" fill="url(#gold)"/>
  <path d="M126,72 L130,72 L128,62 Z" fill="#f8e6a8"/>
  <rect x="119" y="126" width="18" height="6" fill="#dcc08a"/>
  <!-- serpent column -->
  <path d="M148,130 c-4,-9 4,-15 0,-24 c5,6 6,15 2,24 z" fill="#5e7a4a"/>
  <path d="M146,106 l4,-4 l3,4 z" fill="#5e7a4a"/>
  <!-- statue -->
  <rect x="106" y="116" width="5" height="14" fill="#c9c2b4"/>
  <!-- kathisma, the imperial box on the far side -->
  <rect x="110" y="74" width="36" height="14" rx="2" fill="#7a2a6a"/>
  <rect x="106" y="68" width="44" height="7" rx="2" fill="url(#gold)"/>
  <rect x="112" y="72" width="4" height="12" fill="#f0e2bf"/>
  <rect x="140" y="72" width="4" height="12" fill="#f0e2bf"/>
  <!-- near-side shading on the stands -->
  <path d="M16,132 A112,52 0 0 0 240,132 Z" fill="url(#shade)" opacity="0.45"/>
</svg>
